; KeeperFX Mappack file

[common]
NAME = Endless Mode
; Endless Mode (main menu): its one level is a stub the engine replaces with a generated world.
; New Run starts it with a random seed. Hidden: it is not offered under Free Play.
; Folders storing level files for the mappack
LEVELS_LOCATION = levels/endless
; Map pack configs (the research books' objects)
CONFIGS_LOCATION = levels/endless_cfgs
; High score table parameters (num of entries and file name)
HIGH_SCORES = 9999 scr_endl.dat
; Player number to use for human player in these levels.
HUMAN_PLAYER = RED

; Text strings file used for ingame info messages and objectives (not for GUI)

# Builds and publishes an Endless Keeper release: the package (installer/make-package.sh, on Linux), the setup
# (Inno Setup, on Windows), the Android app (android/, on Linux) and a GitHub release with all three.
#
# Names: <KeeperFX stable>-<Endless Keeper release> <stage>, e.g. 1.4.0-4 Alpha: EndlessKeeperSetup-1_4_0-4-Alpha.exe,
# endless-keeper-1_4_0-4-Alpha.7z, EndlessKeeper-1_4_0-4-Alpha.apk (version 1.4.0-4 Alpha), tag v1.4.0-4-alpha. The
# KeeperFX version is the setup's base (BaseVersion in installer/endless-keeper.iss); the release number is one more
# than the highest so far; the stage stays what the last release had unless one is given. Alpha and Beta are
# published as pre-releases. The game's main menu shows "Endless Keeper <release> - <stage>" over the KeeperFX
# version. The APK is signed with the repository secret ANDROID_KEYSTORE_BASE64 (password: ANDROID_KEYSTORE_PASSWORD,
# default android), so each release installs over the last one.
#
# Run it from the Actions tab (Release, Run workflow) to release Endless Keeper's own changes from main. The KeeperFX
# update workflow runs it by itself after merging a new KeeperFX stable release.
name: Release

on:
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage (auto: the same as the last release)'
        type: choice
        options: [auto, Alpha, Beta, Stable]
        default: auto
      dry_run:
        description: 'Test run: the release is made as a draft and deleted again'
        type: boolean
        default: false
      draft:
        description: 'Leave the release as a draft (to write its notes before publishing it)'
        type: boolean
        default: false
      patch:
        description: 'Patch number (e.g. 1 makes 1.4.0-5.1, a patch of the last release; empty: the next release)'
        type: string
        default: ''
  workflow_call:
    inputs:
      prebuilt:
        description: 'The caller built the package (artifact endless-keeper-package)'
        type: boolean
        default: false
      sha:
        description: 'The commit to release (default: the one the workflow runs on)'
        type: string
        default: ''
      stage:
        type: string
        default: ''
      dry_run:
        type: boolean
        default: false
      note:
        description: 'A line for the top of the change list'
        type: string
        default: ''

permissions:
  contents: write

concurrency:
  group: endless-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      STAGE: ${{ inputs.stage }}
      PATCH: ${{ inputs.patch }}
    outputs:
      base: ${{ steps.version.outputs.base }}
      file: ${{ steps.version.outputs.file }}
      tag: ${{ steps.version.outputs.tag }}
      title: ${{ steps.version.outputs.title }}
      stage: ${{ steps.version.outputs.stage }}
      release: ${{ steps.version.outputs.release }}
      release_num: ${{ steps.version.outputs.release_num }}
      apk_name: ${{ steps.version.outputs.apk_name }}
      apk_code: ${{ steps.version.outputs.apk_code }}
    steps:
      # a test run of the KeeperFX update gives a package built from a commit only its runner has
      - uses: actions/checkout@v5
        if: ${{ !inputs.prebuilt }}
        with:
          ref: ${{ inputs.sha || github.sha }}
          sparse-checkout: installer
      - uses: actions/download-artifact@v7
        if: ${{ inputs.prebuilt }}
        with:
          name: endless-keeper-package
          path: installer
      - name: Version
        id: version
        run: |
          set -euo pipefail
          base=$(sed -n 's/^#define BaseVersion *"\(.*\)"/\1/p' installer/endless-keeper.iss | tr -d '\r')
          [ -n "$base" ] || { echo "no BaseVersion in the setup script"; exit 1; }
          tags=$(gh api "repos/$GITHUB_REPOSITORY/tags" --paginate --jq '.[].name' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+-' || true)
          last=$(sed -E 's/^v[0-9.]+-([0-9]+)-.*/\1/' <<< "$tags" | sort -n | tail -1)
          n=$(( ${last:-0} + 1 ))
          # a patch keeps the last release's number: 1.4.0-5.1, 1.4.0-5.2 ...
          patch=${PATCH:-}
          if [ -n "$patch" ]; then
            [[ "$patch" =~ ^[1-9]$ ]] || { echo "the patch number is 1-9, not '$patch'"; exit 1; }
            [ -n "${last:-}" ] || { echo "no release to patch"; exit 1; }
            n=$last
            label="$n.$patch"
            kind=" Patch"
          else
            patch=0
            label="$n"
            kind=""
          fi
          [ "$STAGE" != auto ] || STAGE=
          if [ -z "$STAGE" ]; then
            stage=$(grep -E -- "-${last:-x}-[a-z]+$" <<< "$tags" | head -1 | sed -E 's/.*-([a-z]+)$/\1/')
            stage=${stage:-alpha}
            STAGE="${stage^}"
          fi
          IFS=. read -r major minor rel <<< "$base"
          file="${base//./_}-$label-$STAGE"
          {
            echo "base=$base"
            echo "file=$file"
            echo "tag=v$base-$label-${STAGE,,}"
            echo "title=Endless Keeper $base-$label $STAGE$kind"
            echo "stage=$STAGE"
            echo "release=$label"
            echo "release_num=$n"
            echo "apk_name=$base-$label $STAGE"
            # rises with every release, patch and KeeperFX version: 1.4.0-5 was 104000005 (n alone, before
            # patches); since 1.4.0-5.1, n * 10 + patch: 1.4.0-5.1 = 104000051, 1.4.0-6 = 104000060
            echo "apk_code=$(( major * 100000000 + minor * 1000000 + rel * 10000 + n * 10 + patch ))"
          } | tee -a "$GITHUB_OUTPUT"

  package:
    needs: version
    if: ${{ !inputs.prebuilt }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: ./.github/actions/build-package
        with:
          release: ${{ needs.version.outputs.release }}
          stage: ${{ needs.version.outputs.stage }}
      - name: Keep the package for the release
        run: |
          mkdir -p rel
          cp pkg/endless-keeper.7z installer/endless-keeper.iss installer/endless-keeper.ico rel/
          git rev-parse HEAD > rel/commit.txt
      - uses: actions/upload-artifact@v6
        with:
          name: endless-keeper-package
          path: rel/
          retention-days: 7

  android:
    needs: version
    if: ${{ !inputs.prebuilt }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.sha || github.sha }}
      - uses: ./.github/actions/build-android
        with:
          release: ${{ needs.version.outputs.release }}
          stage: ${{ needs.version.outputs.stage }}
          version-name: ${{ needs.version.outputs.apk_name }}
          version-code: ${{ needs.version.outputs.apk_code }}
          output: apk/EndlessKeeper-${{ needs.version.outputs.file }}.apk
          keystore-base64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          require-key: ${{ inputs.dry_run != true }}
      - uses: actions/upload-artifact@v6
        with:
          name: endless-keeper-android
          path: apk/
          retention-days: 7

  setup:
    needs: [version, package]
    if: ${{ !cancelled() && needs.version.result == 'success' && (needs.package.result == 'success' || needs.package.result == 'skipped') }}
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: endless-keeper-package
          path: rel

      - name: Inno Setup
        run: |
          choco upgrade innosetup -y --no-progress > /dev/null
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" /? 2>&1 | head -2 || true

      - name: Setup
        env:
          N: ${{ needs.version.outputs.release }}
          NUM: ${{ needs.version.outputs.release_num }}
          S: ${{ needs.version.outputs.stage }}
          FILE: ${{ needs.version.outputs.file }}
          MSYS_NO_PATHCONV: 1   # Git Bash would take ISCC's /D options for paths
        run: |
          set -euo pipefail
          "/c/Program Files/7-Zip/7z.exe" x -y -orel/stage rel/endless-keeper.7z > /dev/null
          mkdir -p out
          "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" /Q "/DRelease=$N" "/DReleaseNum=$NUM" "/DStage=$S" \
            "/DPackageDir=$(cygpath -w "$PWD/rel/stage")" "/DOutputDir=$(cygpath -w "$PWD/out")" "$(cygpath -w "$PWD/rel/endless-keeper.iss")"
          cp rel/endless-keeper.7z "out/endless-keeper-$FILE.7z"
          cp rel/commit.txt out/
          ls -la out

      - uses: actions/upload-artifact@v6
        with:
          name: endless-keeper-release
          path: out/
          retention-days: 7

  publish:
    needs: [version, setup, android]
    if: ${{ !cancelled() && needs.setup.result == 'success' && (needs.android.result == 'success' || (inputs.prebuilt && needs.android.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      DRY_RUN: ${{ inputs.dry_run }}
      DRAFT: ${{ inputs.draft }}
      NOTE: ${{ inputs.note }}
      FILE: ${{ needs.version.outputs.file }}
      TAG: ${{ needs.version.outputs.tag }}
      TITLE: ${{ needs.version.outputs.title }}
      STAGE: ${{ needs.version.outputs.stage }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: endless-keeper-release
          path: out
      - uses: actions/download-artifact@v7
        if: ${{ needs.android.result == 'success' }}
        with:
          name: endless-keeper-android
          path: out

      - name: Release notes
        run: |
          set -euo pipefail
          git fetch -q origin main --tags
          sha=$(cat out/commit.txt)
          # a test run's commit may exist only on the runner that made it
          git cat-file -e "$sha^{commit}" 2>/dev/null || sha=$GITHUB_SHA
          echo "SHA=$sha" >> "$GITHUB_ENV"
          prev=$(git tag -l --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+-[0-9]+(\.[0-9]+)?-' | head -1 || true)
          # only the changes (the user's rule for the release notes)
          {
            echo "## Changes"
            echo
            [ -z "$NOTE" ] || echo "- $NOTE"
            if [ -n "$prev" ]; then
              git log --no-merges --format='- %s' "$prev..$sha" -- . ':(exclude)*.md' ':(exclude)docs' | head -80
            fi
          } > notes.md
          cat notes.md

      - name: Publish
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(out/EndlessKeeperSetup-*.exe out/endless-keeper-*.7z out/EndlessKeeper-*.apk)
          ls -la "${files[@]}"
          flags=()
          [ "$STAGE" = Stable ] || flags+=(--prerelease)
          [ "$DRAFT" != true ] || flags+=(--draft)   # the tag is made when the draft is published
          if [ "$DRY_RUN" = true ]; then
            url=$(gh release create "$TAG" "${files[@]}" --draft --target "$SHA" \
              --title "$TITLE (test run)" --notes-file notes.md "${flags[@]}")
            echo "Test run: made the draft $url"
            gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | \"\(.id) \(.assets | map(.name + \" \" + (.size|tostring)) | join(\", \"))\""
            for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id"); do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done
            echo "Test run: the draft is deleted again."
          else
            gh release create "$TAG" "${files[@]}" --target "$SHA" \
              --title "$TITLE" --notes-file notes.md "${flags[@]}"
          fi

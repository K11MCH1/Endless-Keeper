# Builds the Endless Keeper package and the Android app for every change to main and for pull requests, to show they
# still build. Nothing is released; both are kept for two weeks as downloads of the run (the APK is signed with a
# throwaway key, so it can't update an installed app).
name: Build

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-package
      - uses: actions/upload-artifact@v6
        with:
          name: endless-keeper-${{ github.sha }}
          path: pkg/endless-keeper.7z
          retention-days: 14

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/build-android
        with:
          output: apk/EndlessKeeper-dev.apk
      - uses: actions/upload-artifact@v6
        with:
          name: endless-keeper-android-${{ github.sha }}
          path: apk/EndlessKeeper-dev.apk
          retention-days: 14

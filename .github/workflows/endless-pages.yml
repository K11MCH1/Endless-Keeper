# Publishes the players' landing page to GitHub Pages. The page is built from README.md
# (docs/landing/build_page.py), so it changes whenever the README does.
name: Landing page

on:
  push:
    branches: [main]
    paths: ['README.md', 'docs/landing/**', 'docs/images/**', '.github/workflows/endless-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs
      - name: Build the page from the README
        run: |
          python3 -m pip install --quiet --break-system-packages markdown
          python3 docs/landing/build_page.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

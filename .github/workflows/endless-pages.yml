# Publishes the players' landing page (docs/index.html and docs/images) to GitHub Pages.
name: Landing page

on:
  push:
    branches: [main]
    paths: ['docs/index.html', 'docs/images/**', '.github/workflows/endless-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: docs
      - name: Collect the page
        run: |
          mkdir -p site/images
          cp docs/index.html site/
          cp docs/images/endless-keeper-banner.png site/images/
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4

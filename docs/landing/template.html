<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Endless Keeper</title>
<meta name="description" content="Endless Keeper: a Dungeon Keeper survival sandbox mod. Dig forever, grow stronger, in an endless world you can share with your friends.">
<meta property="og:title" content="Endless Keeper">
<meta property="og:description" content="Dungeon Keeper survival sandbox mod. Dig forever. Grow stronger. There is always more underworld to conquer.">
<meta property="og:image" content="https://k11mch1.github.io/Endless-Keeper/images/endless-keeper-banner.png">
<meta property="og:type" content="website">
<style>
  :root {
    --rock: #120d0b; --earth: #1d1512; --earth2: #251b16; --seam: #3a2a20;
    --bone: #e9dcc3; --dust: #b3a184; --gold: #e2b23c; --blood: #9c1b12; --ember: #d2401f;
  }
  * { box-sizing: border-box; }
  html { background: var(--rock); scroll-behavior: smooth; }
  body {
    margin: 0; color: var(--bone);
    background: radial-gradient(1200px 520px at 50% -80px, rgba(210, 64, 31, 0.20), transparent 70%), var(--rock);
    font: 18px/1.65 Georgia, "Iowan Old Style", "Palatino Linotype", "Book Antiqua", serif;
    -webkit-font-smoothing: antialiased;
  }
  .bar {
    position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 20px; background: rgba(18, 13, 11, 0.94); border-bottom: 1px solid var(--seam);
    font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
  }
  .bar .name { color: var(--bone); font-weight: 700; letter-spacing: 0.04em; text-decoration: none; }
  .bar nav { display: flex; align-items: center; gap: 18px; font-size: 15px; }
  .bar nav a { color: var(--dust); text-decoration: none; }
  .bar nav a:hover { color: var(--bone); }
  .bar nav a.get {
    padding: 8px 18px; color: #fff3d6; font-weight: 700; letter-spacing: 0.05em;
    background: linear-gradient(#b5261a, var(--blood)); border: 1px solid var(--gold); border-radius: 6px;
  }
  .bar nav a.get:hover { background: linear-gradient(#cf3323, #ab1f15); color: #fff3d6; }
  @media (max-width: 700px) { .bar nav a.more { display: none; } }
  h2, h3 { scroll-margin-top: 70px; }
  .wrap { max-width: 940px; margin: 0 auto; padding: 28px 20px 56px; }
  a { color: var(--gold); }
  a:focus-visible, summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  img { max-width: 100%; height: auto; }
  .center { text-align: center; }
  .center > p:first-child > img, .center > img:first-child {
    border: 1px solid var(--seam); border-radius: 6px; box-shadow: 0 18px 60px rgba(0, 0, 0, 0.6);
  }
  .center p img[src*="shields.io"] { border: 0; box-shadow: none; border-radius: 0; margin: 2px; vertical-align: middle; }
  h1, h2, h3 { font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif; line-height: 1.15; }
  h1 {
    margin: 30px 0 8px; font-size: clamp(38px, 8vw, 64px); letter-spacing: 0.01em;
    text-shadow: 0 2px 0 #000, 0 0 28px rgba(210, 64, 31, 0.35);
  }
  /* the README's DOWNLOAD HERE heading is the page's button */
  h1 > a:only-child {
    display: inline-block; margin: 14px 0 8px; padding: 18px 44px;
    font-size: clamp(22px, 5vw, 30px); letter-spacing: 0.06em; text-shadow: none;
    color: #fff3d6; text-decoration: none;
    background: linear-gradient(#b5261a, var(--blood));
    border: 2px solid var(--gold); border-radius: 8px;
    box-shadow: 0 6px 0 #4d0d08, 0 16px 34px rgba(0, 0, 0, 0.55);
    transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
  }
  h1 > a:only-child:hover { background: linear-gradient(#cf3323, #ab1f15); }
  h1 > a:only-child:active { transform: translateY(4px); box-shadow: 0 2px 0 #4d0d08, 0 8px 18px rgba(0, 0, 0, 0.55); }
  h2 {
    margin: 52px 0 16px; padding-bottom: 10px; font-size: 32px; color: var(--gold);
    border-bottom: 1px solid var(--seam);
  }
  h3 { margin: 30px 0 10px; font-size: 22px; color: var(--bone); }
  .center h3 { color: var(--gold); font-weight: 400; font-size: 22px; margin: 0; }
  p { margin: 0 0 14px; }
  hr { border: 0; height: 0; margin: 0; }
  ul, ol { padding-left: 24px; margin: 0 0 14px; }
  li { margin: 7px 0; }
  code {
    font: 0.86em/1.4 Consolas, "Cascadia Mono", Menlo, monospace;
    background: #2a1e18; border: 1px solid var(--seam); border-radius: 4px; padding: 1px 5px;
    overflow-wrap: anywhere;
  }
  sub { color: var(--dust); font-size: 14px; }
  .table { overflow-x: auto; margin: 0 0 18px; border: 1px solid var(--seam); border-radius: 8px; background: var(--earth); }
  table { border-collapse: collapse; width: 100%; font-size: 16px; line-height: 1.5; }
  th, td { padding: 11px 14px; text-align: left; vertical-align: top; border-top: 1px solid var(--seam); }
  thead th {
    border-top: 0; background: var(--earth2); color: var(--dust);
    font: 700 13px/1.3 "Trebuchet MS", "Segoe UI", Verdana, sans-serif; letter-spacing: 0.06em; text-transform: uppercase;
  }
  thead th:empty { padding: 0; }
  td:first-child { white-space: nowrap; }
  td strong { color: #fff3d6; }
  blockquote {
    margin: 18px 0; padding: 14px 18px; background: var(--earth);
    border: 1px solid var(--seam); border-left: 4px solid var(--gold); border-radius: 6px;
  }
  blockquote p:last-child { margin-bottom: 0; }
  .alert-title {
    display: block; margin-bottom: 4px; color: var(--gold);
    font: 700 13px/1.3 "Trebuchet MS", "Segoe UI", Verdana, sans-serif; letter-spacing: 0.08em; text-transform: uppercase;
  }
  .alert.tip { border-left-color: #6fae4a; } .alert.tip .alert-title { color: #8fcf68; }
  .alert.warning, .alert.caution { border-left-color: var(--ember); }
  details { margin: 18px 0; padding: 12px 18px; background: var(--earth); border: 1px solid var(--seam); border-radius: 6px; }
  summary { cursor: pointer; color: var(--gold); font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif; }
  details[open] summary { margin-bottom: 10px; }
  footer { margin-top: 56px; padding-top: 18px; border-top: 1px solid var(--seam); text-align: center; color: var(--dust); font-size: 15px; }
  footer a { margin: 0 10px; white-space: nowrap; }
  @media (max-width: 600px) {
    body { font-size: 17px; }
    h2 { font-size: 26px; }
    table { font-size: 15px; }
    th, td { padding: 9px 10px; }
    td:first-child { white-space: normal; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } h1 > a:only-child { transition: none; } }
</style>
</head>
